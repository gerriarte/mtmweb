<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Croky Ar</title>

    <!-- AFRAME + MINDAR -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>


    <style>
        body,
        html {
            margin: 0;
            overflow: hidden;
        }

        /* === OVERLAY DE ESCANEO === */
        .example-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #example-scanning-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: transparent;
            z-index: 2;
        }

        @media (min-aspect-ratio: 1/1) {
            #example-scanning-overlay .inner {
                width: 50vh;
                height: 50vh;
            }
        }

        @media (max-aspect-ratio: 1/1) {
            #example-scanning-overlay .inner {
                width: 80vw;
                height: 80vw;
            }
        }

        #example-scanning-overlay.hidden {
            display: none;
        }

        #example-scanning-overlay .inner {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;

            background:
                linear-gradient(to right, white 10px, transparent 10px) 0 0,
                linear-gradient(to right, white 10px, transparent 10px) 0 100%,
                linear-gradient(to left, white 10px, transparent 10px) 100% 0,
                linear-gradient(to left, white 10px, transparent 10px) 100% 100%,
                linear-gradient(to bottom, white 10px, transparent 10px) 0 0,
                linear-gradient(to bottom, white 10px, transparent 10px) 100% 0,
                linear-gradient(to top, white 10px, transparent 10px) 0 100%,
                linear-gradient(to top, white 10px, transparent 10px) 100% 100%;
            background-repeat: no-repeat;
            background-size: 40px 40px;
        }

        #example-scanning-overlay img {
            opacity: 0.7;
            width: 70%;
            height: 90%;
        }

        .scanline {
            position: absolute;
            width: 100%;
            height: 8px;
            background: white;
            animation: move 2s linear infinite;
        }

        @keyframes move {

            0%,
            100% {
                top: 0%;
            }

            50% {
                top: calc(100% - 8px);
            }
        }

        /* === BOTONES HUD === */
        .hud {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 5;
            display: flex;
            gap: 10px;
        }

        .hud button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .hud button:hover {
            background-color: rgba(200, 200, 200, 0.9);
        }

        #toggleAB {
            padding: 8px;
            border: none;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        #toggleAB img {
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="example-container">
        <!-- Overlay de escaneo personalizado -->
        <div id="example-scanning-overlay">
            <div class="inner">
                <img src="/croky-ar/img/imagen-ref.png" />
                <div class="scanline"></div>
            </div>
        </div>



        <!-- ESCENA -->
        <a-scene
            mindar-image="imageTargetSrc: /croky-ar/croky_target_5.mind; uiScanning: #example-scanning-overlay; warmupTolerance: 1; filterMinCF:0.0001; filterBeta: 0.1; missTolerance: 1;"
            embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-assets>
                <!-- target e imágenes -->

                <img id="imgA" src="/croky-ar/img/croky_10anos.png" />
                <img id="imgB" src="/croky-ar/img/croky_huella.png" />
                <a-asset-item id="croky" src="/croky-ar/modelos/croky-zapatos.glb"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
                raycaster="far: 10000; objects: .clickable"></a-camera>

            <!-- Target principal -->
            <a-entity id="mytarget" mindar-image-target="targetIndex: 0" smooth="true" smooth-count="10"
                smooth-tolerance="0.01" smooth-threshold="5">

                <!-- modelo 3D -->
                <a-gltf-model rotation="90 0 0 " position="0 0 0" scale="0.0015 0.0015 0.0015" src="#croky"
                    id="modeloCroky" animation-mixer="timeScale: 1; startAt: 1000"></a-gltf-model>

                <!-- imágenes pequeñas que se mostrarán con los botones -->
                <a-image id="smallA" src="#imgA" position="-1.3 0.01 0.9" rotation="90 0 0" width="1" height="1"
                    visible="false"></a-image>
                <a-image id="smallB" src="#imgB" position="1.1 0.01 0.9" rotation="90 0 0" width="1" height="1"
                    visible="false"></a-image>

                <a-image id="profile-button" class="clickable"
                    src="/croky-ar/img/logo-sin-fondo-03.png" visible="true"
                    position="-0.80 0 1.4" rotation="90 0 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
                </a-image>
                <a-image id="profile-button2" class="clickable"
                    src="/croky-ar/img/logo-sin-fondo-03.png" visible="true"
                    position="0.50 0 1.4" rotation="90 0 0" height="0.25" width="0.25"
                    animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
                </a-image>

            </a-entity>


        </a-scene>
    </div>

    <script>
        const profileButton = document.querySelector("#profile-button");
        const profileButton2 = document.querySelector("#profile-button2");
        const imgA = document.querySelector("#smallA");
        const imgB = document.querySelector("#smallB");

        profileButton.addEventListener("click", () => {
            const visible = imgA.getAttribute("visible");
            imgA.setAttribute("visible", !visible);
        });

        profileButton2.addEventListener("click", () => {
            const visible = imgB.getAttribute("visible");
            imgB.setAttribute("visible", !visible);
        });
    </script>

</body>

</html>
